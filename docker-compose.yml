version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ai_helpdesk_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_helpdesk
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: ai_helpdesk_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai_helpdesk_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/ai_helpdesk
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=helpdesk_docker_jwt_super_secure_secret_key_minimum_32_chars
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - STORAGE_PROVIDER=local
      - UPLOAD_DIR=/app/uploads
      - UPLOAD_MAX_SIZE=10485760
    depends_on:
      - mongodb
      - redis
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai_helpdesk_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
  redis_data:
  server_uploads:
