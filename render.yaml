services:
  # Backend Node/Express Web Service
  - type: web
    name: nexusdesk-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: '*'
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: UPLOAD_MAX_SIZE
        value: 10485760

  # Frontend React SPA Static Site
  - type: web
    name: nexusdesk-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
