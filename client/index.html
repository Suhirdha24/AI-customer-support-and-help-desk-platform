<!doctype html>
<html lang="en" class="min-h-screen bg-slate-50 dark:bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusDesk AI - Intelligent Customer Support & Helpdesk Platform</title>
    <meta name="description" content="Production-grade AI-powered customer support and helpdesk platform with automated classification, intelligent summarization, and human-in-the-loop assistance." />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('nexusdesk-theme') || 'system';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
    <!-- Google Fonts: Outfit, DM Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen font-sans antialiased text-slate-900 dark:text-slate-100 bg-slate-50 dark:bg-slate-950">
    <div id="root" class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
